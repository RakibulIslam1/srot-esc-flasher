; =============================================================================
;  SROT — ESC flasher / 4-way debug interface (one project, TWO envs)
;    env:esp32_4way       → the flasher itself (use this one normally)
;    env:esp32_4way_diag  → same firmware + a serial bring-up/diagnostic menu
;
;  Flash:  pio run -e esp32_4way -t upload
;          pio run -e esp32_4way_diag -t upload -t monitor   (bench diagnostics)
;  In VSCode PlatformIO, pick the env in the status-bar dropdown, then Upload.
;
;  This project is self-contained: it compiles only src/esp32_4way/ and needs no
;  shared headers, no vendored MAVLink, and no external libraries.
; =============================================================================

[platformio]
default_envs = esp32_4way

; -------- ESP32 DevKit — BLHeli/Bluejay 4-way ESC flasher --------------------
; Turns a spare ESP32 DevKit V1 into a 4-way interface so esc-configurator.com can
; read / flash Bluejay / configure up to 4 ESCs at once over USB — like a Betaflight
; FC's passthrough. ESC1..4 signal → GP16/17/18/19, common GND, ESCs on their own
; power. Steps: src/esp32_4way/README.md, docs/ESC_FLASHING.md.
; Source vendored from github.com/BrushlessPower/BlHeli-Passthrough (ESP32/, see
; src/esp32_4way/LICENSE); the 4-ESC routing is a SROT addition. The ESC link is a
; hand-written single-pin bit-bang half-duplex UART (BitBangSerial.*) that switches
; the pin's MODE between input and output around each direction change — the same
; technique Betaflight/INAV use on a real FC — no resistor, no extra libs.
[env:esp32_4way]
platform = espressif32@^6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<esp32_4way/>

; Same firmware, bench bring-up/diagnostic build: skips the USB MSP/4-way protocol and
; instead runs a plain-text menu over the serial monitor (bit-timing self-check, raw
; ESC-line monitor, BootInit handshake that decodes the ESC's identity, and a full
; 4-way self-test) — for verifying the physical link BEFORE trusting esc-configurator.
; `pio run -e esp32_4way_diag -t upload -t monitor` then press 'h' for the menu.
[env:esp32_4way_diag]
extends = env:esp32_4way
build_flags = -D ESC4WAY_DIAG_MODE=1
